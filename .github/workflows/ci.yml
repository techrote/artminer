name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-build-test:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure x64 Release
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Representative release benchmark
        shell: powershell
        run: |
          & .\build\Release\ArtMinerReleaseBenchmark.exe | Tee-Object -FilePath build\release-benchmark.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: ArtMiner-1.0.0-release-benchmark
          path: build/release-benchmark.txt
          if-no-files-found: error
          retention-days: 7

      - name: Package and smoke-test portable layout
        shell: cmd
        run: scripts\0Package.cmd

      - name: Publish portable Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArtMiner-1.0.0-win-x64
          path: dist/ArtMiner-1.0.0-win-x64.zip
          if-no-files-found: error
          retention-days: 7
