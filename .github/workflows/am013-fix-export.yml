name: AM-013 one-shot repair

on:
  push:
    branches: [am-013-material-loop-workflows]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: am-013-material-loop-workflows
          fetch-depth: 0
      - name: Repair malformed palette provenance literal
        shell: pwsh
        run: |
          $path = 'src/export/export.cpp'
          $text = [System.IO.File]::ReadAllText($path)
          $old = @'
               << "# node " << palette_node_id << '\n# columns: index r g b a\n";
'@
          $new = @'
               << "# node " << palette_node_id << "\n# columns: index r g b a\n";
'@
          if (-not $text.Contains($old)) {
            throw 'Expected malformed AM-013 palette literal was not found.'
          }
          $text = $text.Replace($old, $new)
          [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($false))
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/am013-fix-export.yml
          git add src/export/export.cpp
          git commit -m 'fix: repair AM-013 export palette literal'
          git push origin HEAD:am-013-material-loop-workflows
